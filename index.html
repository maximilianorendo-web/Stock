<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2437">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>MR Stock</title>
<style>
/* Idea: una sola pantalla de trabajo, pensada para el pulgar. Buscar arriba, el libro con su Dep 1 enorme en el medio,
   y abajo los tres botones: − · Ok · +. Los movimientos confirmados quedan en una lista aparte para pasarlos a la PC. */
:root {
  --bg: #f3f4f7;
  --panel: #ffffff;
  --ink: #161c2b;
  --muted: #5d667a;
  --line: #dde1ea;
  --accent: #2756d6;
  --accent-ink: #ffffff;
  --accent-soft: #e4ebff;
  --good: #11763a;
  --good-soft: #dff3e6;
  --bad: #c42b2b;
  --bad-soft: #fbe6e6;
  --hdr: #1b2437;
  --hdr-ink: #f2f4fa;
  --press: #e9ecf3;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151f; --panel: #1a2030; --ink: #eef0f6; --muted: #9ba5bb; --line: #2b3348;
    --accent: #7ba0ff; --accent-ink: #0d1530; --accent-soft: #223056;
    --good: #5fd18b; --good-soft: #17301f; --bad: #ff8585; --bad-soft: #3a1c1c;
    --hdr: #0b0f18; --hdr-ink: #eef0f6; --press: #232a3d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151f; --panel: #1a2030; --ink: #eef0f6; --muted: #9ba5bb; --line: #2b3348;
  --accent: #7ba0ff; --accent-ink: #0d1530; --accent-soft: #223056;
  --good: #5fd18b; --good-soft: #17301f; --bad: #ff8585; --bad-soft: #3a1c1c;
  --hdr: #0b0f18; --hdr-ink: #eef0f6; --press: #232a3d; color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 24px;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
header {
  background: var(--hdr); color: var(--hdr-ink);
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
}
header .in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
header .estado { flex: 1; min-width: 0; font-size: 12px; opacity: .8; line-height: 1.25; }
header .estado b { font-weight: 600; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  font: inherit; font-weight: 600; border-radius: 10px; padding: 10px 14px; min-height: 44px; cursor: pointer;
}
.btn:active { background: var(--press); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.chico { min-height: 36px; padding: 6px 10px; font-size: 14px; }
.btn[disabled] { opacity: .45; }
header .btn { background: transparent; color: var(--hdr-ink); border-color: rgba(255,255,255,.35); min-height: 38px; padding: 6px 12px; font-size: 14px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--press); border-radius: 12px; padding: 4px; gap: 4px; margin-top: 12px; }
.tabs button { appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600; min-height: 42px; border-radius: 9px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.buscador { display: flex; gap: 8px; }
.buscador .campo { position: relative; flex: 1; min-width: 0; }
.buscador input {
  width: 100%; font: inherit; font-size: 18px; color: var(--ink); background: var(--panel);
  border: 2px solid var(--line); border-radius: 12px; padding: 12px 44px 12px 14px; min-height: 52px;
}
.buscador input:focus { border-color: var(--accent); outline: none; }
.buscador .x { position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: 0; background: transparent; color: var(--muted); font-size: 22px; cursor: pointer; }
.ficha { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.ficha h2 { font-size: 20px; line-height: 1.2; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.ficha .sub { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.dep { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.dep .rot { font-size: 18px; color: var(--muted); font-weight: 600; }
.dep .num { font-size: 64px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
.dep .num.cero { color: var(--bad); }
.dep .nuevo { font-size: 30px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.dep .nuevo.baja { color: var(--bad); }
.otros { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.tres { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 10px; margin-top: 4px; }
.tres button { appearance: none; border: 0; border-radius: 14px; min-height: 76px; font: inherit; font-size: 34px; font-weight: 800; cursor: pointer; }
.tres .mas, .tres .menos { background: var(--accent-soft); color: var(--accent); }
.tres .ok { background: var(--accent); color: var(--accent-ink); font-size: 28px; }
.tres button:active { filter: brightness(.9); }
.tres button[disabled] { opacity: .4; }
.lista { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.fila { display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); cursor: pointer; width: 100%; text-align: left; background: transparent; color: inherit; font: inherit; border-left: 0; border-right: 0; border-bottom: 0; }
.fila:first-child { border-top: 0; }
.fila:active { background: var(--press); }
.fila[aria-selected="true"] { background: var(--accent-soft); }
.fila .txt { flex: 1; min-width: 0; }
.fila .t { font-weight: 600; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fila .m { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.fila .d { font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
.fila .d.cero { color: var(--bad); }
.nota { color: var(--muted); font-size: 14px; padding: 8px 2px; }
.vacio { text-align: center; color: var(--muted); padding: 28px 12px; background: var(--panel); border: 1px dashed var(--line); border-radius: 14px; }
.vacio b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
.mov { display: flex; gap: 10px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); }
.mov:first-child { border-top: 0; }
.mov .txt { flex: 1; min-width: 0; }
.mov .t { font-weight: 600; overflow-wrap: anywhere; }
.mov .m { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.mov .dl { font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.mov .dl.mas { color: var(--good); } .mov .dl.menos { color: var(--bad); }
.acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.acciones .ancho { grid-column: 1 / -1; }
.aviso { padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 14px; }
.aviso.mal { background: var(--bad-soft); color: var(--bad); }
.aviso.bien { background: var(--good-soft); color: var(--good); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--hdr); color: var(--hdr-ink); padding: 12px 18px; border-radius: 12px; font-weight: 600; max-width: calc(100% - 32px); z-index: 20; box-shadow: 0 4px 16px rgba(0,0,0,.3); }
#scan { position: fixed; inset: 0; background: #000; z-index: 30; display: flex; flex-direction: column; }
#scan video { flex: 1; min-height: 0; width: 100%; object-fit: cover; }
#scan .barra { padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); color: #fff; display: flex; gap: 12px; align-items: center; justify-content: space-between; background: #111; }
@media (prefers-reduced-motion: no-preference) { .tres button { transition: filter .1s; } }
</style>

</head><body>
<header>
  <div class="in">
    <h1>MR Stock</h1>
    <div class="estado" id="estado">Sin stock cargado</div>
    <button class="btn" id="btnCargar" type="button">Cargar stock.csv</button>
    <input type="file" id="archivo" accept=".csv,text/csv,text/plain,*/*" hidden>
  </div>
</header>

<main class="wrap">
  <div class="tabs" role="tablist">
    <button role="tab" id="tabBuscar" aria-selected="true" type="button">Buscar</button>
    <button role="tab" id="tabMov" aria-selected="false" type="button">Movimientos <span id="nMov"></span></button>
  </div>

  <section id="vistaBuscar" class="wrap" style="gap:12px">
    <div class="buscador">
      <div class="campo">
        <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Título, autor o ISBN" aria-label="Buscar libro">
        <button class="x" id="borrarQ" type="button" aria-label="Borrar búsqueda" hidden>×</button>
      </div>
      <button class="btn" id="btnScan" type="button" aria-label="Escanear código de barras" hidden>Escanear</button>
    </div>

    <div id="ficha" class="ficha" hidden>
      <h2 id="fTit"></h2>
      <div class="sub" id="fSub"></div>
      <div class="dep" aria-live="polite">
        <span class="rot">Dep 1:</span><span class="num" id="fDep">0</span><span class="nuevo" id="fNuevo" hidden></span>
      </div>
      <div class="otros"><span id="fDep11"></span><span id="fPvp"></span><span id="fCod"></span></div>
      <div class="tres">
        <button type="button" class="menos" id="bMenos" aria-label="Restar uno">−</button>
        <button type="button" class="ok" id="bOk" aria-label="Confirmar el cambio">Ok</button>
        <button type="button" class="mas" id="bMas" aria-label="Sumar uno">+</button>
      </div>
    </div>

    <div id="resultados"></div>
  </section>

  <section id="vistaMov" class="wrap" style="gap:12px" hidden>
    <div id="movLista"></div>
    <div class="acciones" id="movAcciones" hidden>
      <button class="btn pri" id="cSumas" type="button">Copiar sumas</button>
      <button class="btn pri" id="cRestas" type="button">Copiar restas</button>
      <button class="btn ancho" id="bCsv" type="button">Descargar stock.csv con los cambios</button>
      <button class="btn ancho" id="bBorrar" type="button">Borrar la lista de movimientos</button>
    </div>
    <div id="movAviso"></div>
  </section>
</main>

<div id="toast" hidden></div>
<div id="scan" hidden>
  <video id="video" playsinline muted></video>
  <div class="barra"><span id="scanTxt">Apuntá al código de barras del libro</span><button class="btn" id="scanCerrar" type="button">Cerrar</button></div>
</div>

<script>
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
</script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var S = null;            // stock cargado
  var MOV = [];            // movimientos confirmados
  var OVER = {};           // líneas del csv modificadas: { posición: línea nueva }
  var sel = -1, pend = 0, res = [], toastT = null;

  /* ---------- texto y números ---------- */
  function norm(t) {
    return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
  }
  function esc(w) { return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function num(t) {
    t = String(t == null ? '' : t).trim();
    var neg = false;
    if (t.slice(-1) === '-') { neg = true; t = t.slice(0, -1).trim(); }
    else if (t.charAt(0) === '-') { neg = true; t = t.slice(1).trim(); }
    if (!t) return 0;
    if (t.indexOf(',') >= 0) t = t.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
    var n = parseFloat(t);
    if (isNaN(n)) return 0;
    return neg ? -n : n;
  }
  function fmtNum(n, ancho) {
    var base = String(Math.abs(Math.round(n)));
    if (n < 0) base += '-';                       // Ultra escribe los negativos con el menos al final
    while (base.length < ancho) base = ' ' + base;
    return base;
  }
  function pesos(n) {
    if (!n) return '';
    return '$ ' + n.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  /* campos de una línea sin tocar las comillas (así al volver a unirla queda igual) */
  function crudo(l) {
    if (l.indexOf('"') < 0) return l.split(';');
    var out = [], cur = '', q = false;
    for (var i = 0; i < l.length; i++) {
      var c = l.charAt(i);
      if (c === '"') { q = !q; cur += c; }
      else if (c === ';' && !q) { out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur);
    return out;
  }
  function limpio(c) {
    c = c.trim();
    if (c.length > 1 && c.charAt(0) === '"' && c.charAt(c.length - 1) === '"') c = c.slice(1, -1).replace(/""/g, '"');
    return c;
  }
  function clave(t) { return norm(t).replace(/[^a-z0-9]/g, ''); }
  function codNorm(t) { return String(t || '').replace(/[^0-9xX]/g, '').toUpperCase().replace(/^0+/, ''); }

  /* ---------- lectura del stock.csv ---------- */
  function decodificar(buf) {
    try { return { texto: new TextDecoder('utf-8', { fatal: true }).decode(buf), enc: 'utf-8' }; }
    catch (e) { return { texto: new TextDecoder('windows-1252').decode(buf), enc: 'windows-1252' }; }
  }
  function armar(texto, enc, nombre, fecha) {
    var eol = texto.indexOf('\r\n') >= 0 ? '\r\n' : '\n';
    var lineas = texto.split(eol);
    var cab = crudo(lineas[0].replace(/^﻿/, '')).map(function (c) { return clave(limpio(c)); });
    var ix = function () {
      for (var a = 0; a < arguments.length; a++) { var i = cab.indexOf(arguments[a]); if (i >= 0) return i; }
      return -1;
    };
    var c = { cod: ix('codigo'), tit: ix('titulo'), aut: ix('autor'), edi: ix('editor', 'editorial'),
              d1: ix('dep1'), d11: ix('dep11con', 'dep11'), tot: ix('canttotal'), pvp: ix('pvp'), isbn: ix('isbn'), barra: ix('codbarra') };
    if (c.cod < 0 || c.tit < 0 || c.d1 < 0) throw new Error('El archivo no parece un stock.csv: le faltan las columnas Codigo, TITULO o Dep 1.');
    var P = { nombre: nombre, fecha: fecha, enc: enc, eol: eol, lineas: lineas, c: c, pos: [], cod: [], tit: [], aut: [], edi: [],
              d1: [], d11: [], pvp: [], hay: [], porCod: new Map() };
    for (var n = 1; n < lineas.length; n++) {
      var l = lineas[n];
      if (!l.trim()) continue;
      var f = crudo(l);
      var t = limpio(f[c.tit] || '');
      if (/^anulado/i.test(t)) continue;
      var k = P.pos.length;
      P.pos.push(n);
      P.cod.push(limpio(f[c.cod] || ''));
      P.tit.push(t);
      P.aut.push(c.aut >= 0 ? limpio(f[c.aut] || '') : '');
      P.edi.push(c.edi >= 0 ? limpio(f[c.edi] || '') : '');
      P.d1.push(num(f[c.d1]));
      P.d11.push(c.d11 >= 0 ? num(f[c.d11]) : 0);
      P.pvp.push(c.pvp >= 0 ? num(f[c.pvp]) : 0);
      P.hay.push(norm(t + ' ' + P.aut[k]));
      [c.cod, c.isbn, c.barra].forEach(function (j) {
        if (j >= 0) { var cn = codNorm(f[j]); if (cn.length >= 6 && !P.porCod.has(cn)) P.porCod.set(cn, k); }
      });
    }
    return P;
  }
  function aplicarOver(P, over) {
    Object.keys(over).forEach(function (p) {
      var n = +p; P.lineas[n] = over[p];
      var k = P.pos.indexOf(n);
      if (k >= 0) { var f = crudo(over[p]); P.d1[k] = num(f[P.c.d1]); if (P.c.d11 >= 0) P.d11[k] = num(f[P.c.d11]); }
    });
  }

  /* ---------- guardado en el celular (IndexedDB) ---------- */
  var dbp = null;
  function db() {
    if (dbp) return dbp;
    dbp = new Promise(function (ok, no) {
      try {
        var r = indexedDB.open('mrstock', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
        r.onsuccess = function () { ok(r.result); };
        r.onerror = function () { no(r.error); };
      } catch (e) { no(e); }
    });
    return dbp;
  }
  function guardar(k, v) {
    return db().then(function (d) {
      return new Promise(function (ok, no) {
        var t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k);
        t.oncomplete = ok; t.onerror = function () { no(t.error); };
      });
    }).catch(function () {});
  }
  function leer(k) {
    return db().then(function (d) {
      return new Promise(function (ok, no) {
        var q = d.transaction('kv').objectStore('kv').get(k);
        q.onsuccess = function () { ok(q.result); }; q.onerror = function () { no(q.error); };
      });
    }).catch(function () { return undefined; });
  }
  function guardarMov() { return guardar('mov', { movs: MOV, over: OVER }); }

  /* ---------- pantalla ---------- */
  function toast(t) {
    var e = $('toast'); e.textContent = t; e.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function () { e.hidden = true; }, 2200);
  }
  function estado() {
    var e = $('estado');
    if (!S) { e.textContent = 'Sin stock cargado'; $('btnCargar').textContent = 'Cargar stock.csv'; return; }
    e.innerHTML = '<b></b><br><span></span>';
    e.querySelector('b').textContent = S.nombre;
    e.querySelector('span').textContent = S.pos.length.toLocaleString('es-AR') + ' libros · ' + S.fecha;
    $('btnCargar').textContent = 'Cambiar';
  }
  function pestana(cual) {
    var b = cual === 'buscar';
    $('vistaBuscar').hidden = !b; $('vistaMov').hidden = b;
    $('tabBuscar').setAttribute('aria-selected', b); $('tabMov').setAttribute('aria-selected', !b);
    if (!b) pintarMov();
  }
  function pintarVacio() {
    var r = $('resultados');
    r.innerHTML = '';
    var d = document.createElement('div'); d.className = 'vacio';
    var b = document.createElement('b'); var p = document.createElement('span');
    if (!S) { b.textContent = 'Cargá tu stock.csv'; p.textContent = 'Tocá “Cargar stock.csv” y elegí el archivo que exporta Ultra. Queda guardado en el celular.'; }
    else { b.textContent = 'Buscá un libro'; p.textContent = 'Escribí parte del título, el autor o el ISBN. Por ejemplo: sociedad del cansancio.'; }
    d.appendChild(b); d.appendChild(p); r.appendChild(d);
  }
  function buscar(q) {
    if (!S) return [];
    var dig = q.replace(/[\s-]/g, '');
    if (/^\d{8,}$/.test(dig)) {
      var k = S.porCod.get(codNorm(dig));
      return k == null ? [] : [k];
    }
    var qn = norm(q); if (!qn) return [];
    var pats = qn.split(' ').map(function (w) { return new RegExp('(^|[^a-z0-9])' + esc(w)); });
    var out = [];
    for (var i = 0; i < S.hay.length; i++) {
      var h = S.hay[i], ok = true;
      for (var j = 0; j < pats.length; j++) if (!pats[j].test(h)) { ok = false; break; }
      if (ok) out.push(i);
    }
    var empieza = pats[0];
    out.sort(function (a, b) {
      var sa = S.hay[a].indexOf(norm(q).split(' ')[0]) === 0 ? 0 : 1, sb = S.hay[b].indexOf(norm(q).split(' ')[0]) === 0 ? 0 : 1;
      if (sa !== sb) return sa - sb;
      var da = S.d1[a] > 0 ? 0 : 1, db2 = S.d1[b] > 0 ? 0 : 1;
      if (da !== db2) return da - db2;
      return S.hay[a] < S.hay[b] ? -1 : 1;
    });
    return out;
  }
  function pintarResultados() {
    var q = $('q').value.trim();
    $('borrarQ').hidden = !q;
    if (!S || !q) { res = []; if (sel < 0) pintarVacio(); else $('resultados').innerHTML = ''; return; }
    res = buscar(q);
    var r = $('resultados'); r.innerHTML = '';
    if (!res.length) {
      var d = document.createElement('div'); d.className = 'vacio';
      var b = document.createElement('b'); b.textContent = 'No encontré ese libro';
      var p = document.createElement('span'); p.textContent = 'Probá con menos palabras o con el ISBN.';
      d.appendChild(b); d.appendChild(p); r.appendChild(d); return;
    }
    var caja = document.createElement('div'); caja.className = 'lista'; caja.setAttribute('role', 'listbox');
    res.slice(0, 40).forEach(function (k) {
      var f = document.createElement('button'); f.type = 'button'; f.className = 'fila';
      f.setAttribute('role', 'option'); f.setAttribute('aria-selected', k === sel);
      var t = document.createElement('div'); t.className = 'txt';
      var a = document.createElement('div'); a.className = 't'; a.textContent = S.tit[k];
      var m = document.createElement('div'); m.className = 'm'; m.textContent = [S.aut[k], S.edi[k]].filter(Boolean).join(' · ');
      t.appendChild(a); t.appendChild(m);
      var d = document.createElement('div'); d.className = 'd' + (S.d1[k] <= 0 ? ' cero' : ''); d.textContent = String(S.d1[k]);
      f.appendChild(t); f.appendChild(d);
      f.addEventListener('click', function () { elegir(k); });
      caja.appendChild(f);
    });
    r.appendChild(caja);
    if (res.length > 40) {
      var n = document.createElement('div'); n.className = 'nota';
      n.textContent = 'Son ' + res.length + ' resultados: se muestran los primeros 40. Sumá una palabra para acotar.';
      r.appendChild(n);
    }
    if (res.length === 1 && sel !== res[0]) elegir(res[0], true);
  }
  function elegir(k, silencioso) {
    sel = k; pend = 0; pintarFicha();
    if (!silencioso) { pintarResultados(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  }
  function pintarFicha() {
    var f = $('ficha');
    if (sel < 0 || !S) { f.hidden = true; return; }
    f.hidden = false;
    $('fTit').textContent = S.tit[sel];
    $('fSub').textContent = [S.aut[sel], S.edi[sel]].filter(Boolean).join(' · ');
    var d = S.d1[sel];
    var e = $('fDep'); e.textContent = String(d); e.className = 'num' + (d <= 0 ? ' cero' : '');
    var nv = $('fNuevo');
    if (pend) { nv.hidden = false; nv.textContent = '→ ' + (d + pend); nv.className = 'nuevo' + (pend < 0 ? ' baja' : ''); }
    else nv.hidden = true;
    $('fDep11').textContent = 'Dep 11: ' + S.d11[sel];
    $('fPvp').textContent = S.pvp[sel] ? 'PVP ' + pesos(S.pvp[sel]) : '';
    $('fCod').textContent = S.cod[sel];
    $('bOk').disabled = pend === 0;
    $('bMenos').disabled = d + pend <= 0;
  }
  function cambiar(p) {
    if (sel < 0) return;
    if (S.d1[sel] + pend + p < 0) return;
    pend += p; pintarFicha();
  }
  function confirmar() {
    if (sel < 0 || !pend) return;
    var n = S.pos[sel], f = crudo(S.lineas[n]), c = S.c;
    var antes = num(f[c.d1]), ahora = antes + pend;
    f[c.d1] = fmtNum(ahora, f[c.d1].length);
    if (c.tot >= 0 && f[c.tot] != null) f[c.tot] = fmtNum(num(f[c.tot]) + pend, f[c.tot].length);
    S.lineas[n] = f.join(';'); OVER[n] = S.lineas[n];
    S.d1[sel] = ahora;
    MOV.push({ t: Date.now(), n: n, cod: S.cod[sel], tit: S.tit[sel], antes: antes, ahora: ahora, delta: pend });
    guardarMov();
    toast('✓ Dep 1: ' + antes + ' → ' + ahora);
    pend = 0; pintarFicha(); pintarResultados(); contar();
  }
  function contar() { $('nMov').textContent = MOV.length ? '(' + MOV.length + ')' : ''; }

  /* ---------- movimientos ---------- */
  function neto() {
    var m = {};
    MOV.forEach(function (x) { m[x.cod] = (m[x.cod] || 0) + x.delta; });
    var sumas = [], restas = [];
    Object.keys(m).forEach(function (c) { if (m[c] > 0) sumas.push(c + '\t' + m[c]); else if (m[c] < 0) restas.push(c + '\t' + (-m[c])); });
    return { sumas: sumas, restas: restas };
  }
  function pintarMov() {
    var cont = $('movLista'); cont.innerHTML = '';
    $('movAcciones').hidden = !MOV.length;
    if (!MOV.length) {
      var d = document.createElement('div'); d.className = 'vacio';
      var b = document.createElement('b'); b.textContent = 'Todavía no hay movimientos';
      var p = document.createElement('span'); p.textContent = 'Cada vez que confirmás con Ok, el cambio queda anotado acá.';
      d.appendChild(b); d.appendChild(p); cont.appendChild(d); return;
    }
    var caja = document.createElement('div'); caja.className = 'lista';
    MOV.slice().reverse().forEach(function (m, i) {
      var idx = MOV.length - 1 - i;
      var r = document.createElement('div'); r.className = 'mov';
      var t = document.createElement('div'); t.className = 'txt';
      var a = document.createElement('div'); a.className = 't'; a.textContent = m.tit;
      var h = new Date(m.t);
      var s = document.createElement('div'); s.className = 'm';
      s.textContent = h.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }) + ' · ' + m.antes + ' → ' + m.ahora;
      t.appendChild(a); t.appendChild(s);
      var dl = document.createElement('div'); dl.className = 'dl ' + (m.delta > 0 ? 'mas' : 'menos'); dl.textContent = (m.delta > 0 ? '+' : '−') + Math.abs(m.delta);
      var u = document.createElement('button'); u.type = 'button'; u.className = 'btn chico'; u.textContent = 'Deshacer';
      u.addEventListener('click', function () { deshacer(idx); });
      r.appendChild(t); r.appendChild(dl); r.appendChild(u); caja.appendChild(r);
    });
    cont.appendChild(caja);
    var nt = neto();
    $('cSumas').textContent = 'Copiar sumas (' + nt.sumas.length + ')';
    $('cRestas').textContent = 'Copiar restas (' + nt.restas.length + ')';
    $('cSumas').disabled = !nt.sumas.length; $('cRestas').disabled = !nt.restas.length;
  }
  function deshacer(i) {
    var m = MOV[i]; if (!m || !S) return;
    var f = crudo(S.lineas[m.n]), c = S.c;
    var cur = num(f[c.d1]), nuevo = Math.max(0, cur - m.delta), real = nuevo - cur;
    f[c.d1] = fmtNum(nuevo, f[c.d1].length);
    if (c.tot >= 0 && f[c.tot] != null) f[c.tot] = fmtNum(num(f[c.tot]) + real, f[c.tot].length);
    S.lineas[m.n] = f.join(';'); OVER[m.n] = S.lineas[m.n];
    var k = S.pos.indexOf(m.n); if (k >= 0) S.d1[k] = nuevo;
    MOV.splice(i, 1); guardarMov(); contar(); pintarMov(); pintarFicha();
    toast('Deshecho');
  }
  function copiar(texto, que) {
    function listo() { aviso('✓ Copiado: ' + que + '. Pegalo en PEDIDOS (botón correspondiente) en la PC, por ejemplo mandándotelo por WhatsApp.', 'bien'); }
    function respaldo() {
      var ta = document.createElement('textarea'); ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      if (ok) listo(); else aviso('No pude copiar solo. Copiá esto a mano:\n' + texto, 'mal');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(listo, respaldo);
    else respaldo();
  }
  function aviso(t, tipo) {
    var e = $('movAviso'); e.innerHTML = '';
    if (!t) return;
    var d = document.createElement('div'); d.className = 'aviso ' + (tipo || ''); d.style.whiteSpace = 'pre-wrap'; d.textContent = t; e.appendChild(d);
  }
  var mapa1252 = null;
  function bytes(texto, enc) {
    if (enc === 'utf-8') return new TextEncoder().encode(texto);
    if (!mapa1252) {
      mapa1252 = {};
      var dec = new TextDecoder('windows-1252');
      for (var b = 0x80; b <= 0x9f; b++) mapa1252[dec.decode(new Uint8Array([b]))] = b;
    }
    var out = new Uint8Array(texto.length);
    for (var i = 0; i < texto.length; i++) {
      var cc = texto.charCodeAt(i);
      out[i] = cc < 256 ? cc : (mapa1252[texto.charAt(i)] || 63);
    }
    return out;
  }
  function descargarCsv() {
    if (!S) return;
    var blob = new Blob([bytes(S.lineas.join(S.eol), S.enc)], { type: 'text/csv' });
    var nombre = S.nombre.replace(/\.csv$/i, '') + ' (movimientos ' + new Date().toISOString().slice(0, 10) + ').csv';
    try {
      var file = new File([blob], nombre, { type: 'text/csv' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file] }).catch(function () {}); aviso('Elegí dónde mandar el stock.csv.', ''); return; }
    } catch (e) {}
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    aviso('Si no se descargó nada, abrí este archivo directamente en Chrome (no desde una vista previa) y volvé a probar. Mientras tanto, “Copiar sumas / restas” funciona siempre.', '');
  }
  var confBorrar = false;
  function borrarLista() {
    var b = $('bBorrar');
    if (!confBorrar) { confBorrar = true; b.textContent = 'Tocá de nuevo para borrar (los cambios del stock quedan)'; setTimeout(function () { confBorrar = false; b.textContent = 'Borrar la lista de movimientos'; }, 4000); return; }
    confBorrar = false; b.textContent = 'Borrar la lista de movimientos';
    MOV = []; guardarMov(); contar(); pintarMov(); aviso('Lista borrada. El stock sigue con los cambios hechos.', 'bien');
  }

  /* ---------- carga de archivo ---------- */
  function cargarArchivo(file) {
    if (!file) return;
    $('estado').textContent = 'Leyendo ' + file.name + '…';
    file.arrayBuffer().then(function (buf) {
      return new Promise(function (ok) { setTimeout(function () { ok(buf); }, 30); });
    }).then(function (buf) {
      var d = decodificar(buf);
      var fecha = new Date(file.lastModified || Date.now()).toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      var P = armar(d.texto, d.enc, file.name, fecha);
      if (MOV.length || Object.keys(OVER).length) { MOV = []; OVER = {}; }      // un stock nuevo ya trae todo al día
      S = P; sel = -1; pend = 0;
      guardar('csv', { texto: d.texto, enc: d.enc, nombre: file.name, fecha: fecha });
      guardarMov();
      estado(); contar(); pintarFicha(); pintarResultados(); pintarMov();
      toast('✓ ' + P.pos.length.toLocaleString('es-AR') + ' libros cargados');
      $('q').focus();
    }).catch(function (e) { estado(); toast(e && e.message ? e.message : 'No pude leer el archivo'); });
  }

  /* ---------- escáner (solo donde el navegador lo permite) ---------- */
  var scanStream = null, scanTimer = null;
  function cerrarScan() {
    clearInterval(scanTimer); scanTimer = null;
    if (scanStream) { scanStream.getTracks().forEach(function (t) { t.stop(); }); scanStream = null; }
    $('scan').hidden = true;
  }
  function abrirScan() {
    var det;
    try { det = new window.BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'code_128'] }); } catch (e) { toast('Este navegador no puede leer códigos'); return; }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function (s) {
      scanStream = s; var v = $('video'); v.srcObject = s; $('scan').hidden = false; v.play();
      scanTimer = setInterval(function () {
        det.detect(v).then(function (r) {
          if (r && r.length) { var cod = r[0].rawValue; cerrarScan(); $('q').value = cod; pintarResultados(); }
        }).catch(function () {});
      }, 250);
    }).catch(function () { toast('No tengo permiso para usar la cámara'); });
  }

  /* ---------- arranque ---------- */
  $('btnCargar').addEventListener('click', function () { $('archivo').click(); });
  $('archivo').addEventListener('change', function () { cargarArchivo(this.files && this.files[0]); this.value = ''; });
  $('tabBuscar').addEventListener('click', function () { pestana('buscar'); });
  $('tabMov').addEventListener('click', function () { pestana('mov'); });
  var tq = null;
  $('q').addEventListener('input', function () { clearTimeout(tq); tq = setTimeout(function () { sel = -1; pintarFicha(); pintarResultados(); }, 160); });
  $('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); clearTimeout(tq); sel = -1; pintarFicha(); pintarResultados(); this.blur(); } });
  $('borrarQ').addEventListener('click', function () { $('q').value = ''; sel = -1; pintarFicha(); pintarResultados(); $('q').focus(); });
  $('bMas').addEventListener('click', function () { cambiar(1); });
  $('bMenos').addEventListener('click', function () { cambiar(-1); });
  $('bOk').addEventListener('click', confirmar);
  $('cSumas').addEventListener('click', function () { copiar(neto().sumas.join('\n'), 'lo que sumaste'); });
  $('cRestas').addEventListener('click', function () { copiar(neto().restas.join('\n'), 'lo que restaste'); });
  $('bCsv').addEventListener('click', descargarCsv);
  $('bBorrar').addEventListener('click', borrarLista);
  $('scanCerrar').addEventListener('click', cerrarScan);
  if ('BarcodeDetector' in window && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) { $('btnScan').hidden = false; $('btnScan').addEventListener('click', abrirScan); }

  pintarVacio();
  Promise.all([leer('csv'), leer('mov')]).then(function (r) {
    var c = r[0], m = r[1];
    if (m) { MOV = m.movs || []; OVER = m.over || {}; }
    if (c && c.texto) {
      try { S = armar(c.texto, c.enc, c.nombre, c.fecha); aplicarOver(S, OVER); } catch (e) { S = null; }
    }
    estado(); contar(); pintarResultados();
  });
})();
</script>
